name: Weekly upstream sync

# Runs every Monday at 14:00 UTC. Fetches upstream (garrytan/gbrain), opens
# a PR if there are new commits. Does NOT auto-merge — explicit human review
# required (and contract tests block merge if integration breaks).

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC
  workflow_dispatch:  # also allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/garrytan/gbrain.git
          git fetch upstream

      - name: Check if upstream has new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master 2>/dev/null || echo "0")
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Fork is $BEHIND commits behind upstream/master"

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/upstream-$DATE"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/master --no-ff -m "chore: sync with upstream/master"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get upstream commit summary
        if: steps.check.outputs.behind != '0'
        id: summary
        run: |
          SUMMARY=$(git log HEAD~${{ steps.check.outputs.behind }}..HEAD --oneline | head -20)
          {
            echo 'summary<<EOF'
            echo "$SUMMARY"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Open PR for explicit review
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Weekly sync from upstream/master ($(date -u +%Y-%m-%d))" \
            --body "## Automated weekly sync

          Fork is **${{ steps.check.outputs.behind }} commits** behind upstream/master.

          ### Recent upstream commits

          \`\`\`
          ${{ steps.summary.outputs.summary }}
          \`\`\`

          ### Review checklist

          - [ ] Read the upstream changes — anything that touches our integration points?
          - [ ] Run contract tests locally (\`bun test tests/wiki/gbrainContract.test.ts\` in the bot repo)
          - [ ] If contract tests fail: investigate, file an issue against our extensions, do NOT merge
          - [ ] If contract tests pass: review for any breaking API changes that affect our adapters
          - [ ] If clean: approve and merge

          **Auto-merge is intentionally disabled.** This PR sits open until a human reviews it.

          ---
          Generated by \`.github/workflows/sync-upstream.yml\`"

      - name: Up-to-date notification
        if: steps.check.outputs.behind == '0'
        run: |
          echo "Fork is up-to-date with upstream/master. No PR created."
